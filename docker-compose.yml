version: '3.8'

services:
  alfred-bot:
    build: .
    container_name: alfred-bot
    restart: unless-stopped
    environment:
      - NINEROUTER_URL=${NINEROUTER_URL}
      - NINEROUTER_KEY=${NINEROUTER_KEY}
      - AI_MODEL=${AI_MODEL}
      - ALPETA_NUMBER=${ALPETA_NUMBER}
    volumes:
      # INI BAGIAN MOUNT VOLUME
      - alfred_session:/app/alfred_session
      - chat_history:/app/chat_history

# INI WAJIB ADA DI BAWAH (Untuk mendefinisikan named volumes)
volumes:
  alfred_session:
  chat_history: