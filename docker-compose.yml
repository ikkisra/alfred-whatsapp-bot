version: '3.8'

services:
  alfred-bot:
    build: .
    container_name: alfred-bot
    restart: unless-stopped
    environment:
      - NINEROUTER_URL=https://api.farouter.tech/v1
      - NINEROUTER_KEY=sk-xxxxx
      - AI_MODEL=mimo-v2.5-pro
      - ALPETA_NUMBER=6289637888463
    volumes:
      # INI BAGIAN MOUNT VOLUME
      - alfred_session:/app/alfred_session
      - chat_history:/app/chat_history
      - blacklist.json:/app/blacklist.json

# INI WAJIB ADA DI BAWAH (Untuk mendefinisikan named volumes)
volumes:
  alfred_session:
  chat_history:
  blacklist.json: